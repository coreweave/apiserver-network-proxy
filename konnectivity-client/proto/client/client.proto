syntax = "proto3";

// Retransmit?
// Sliding windows?

option go_package = "sigs.k8s.io/apiserver-network-proxy/konnectivity-client/proto/client";

service ProxyService {
  rpc Proxy(stream Packet) returns (stream Packet) {}
}

enum PacketType {
  DIAL_REQ = 0;
  DIAL_RSP = 1;
  CLOSE_REQ = 2;
  CLOSE_RSP = 3;
  DATA = 4;
  DIAL_CLS = 5;
  DRAIN = 6;
  DATA_ACK = 7;
}

message Packet {
  PacketType type = 1;

  oneof payload {
    DialRequest dialRequest = 2;
    DialResponse dialResponse = 3;
    Data data = 4;
    CloseRequest closeRequest = 5;
    CloseResponse closeResponse = 6;
    CloseDial closeDial = 7;
    Drain drain = 8;
    DataAck dataAck = 9;
  }
}

message DialRequest {
    // tcp or udp?
    string protocol = 1;

    // node:port
    string address = 2;

    // random id for client, maybe should be longer
    int64 random = 3;

    // TODO: currently not used, as for throttling agent -> server
    // - added by server to inform agent
    // window size for flow control
    int64 windowSize = 4;
}

message DialResponse {
    // error failed reason; enum?
    string error = 1;

    // connectID indicates the identifier of the connection
    int64 connectID = 2;

    // random copied from DialRequest
    int64 random = 3;

    // window size for flow control
   // - this is how the agent informs the sender about the capacity of it's receive window (impl. via semaphore of the same size)
    int64 windowSize = 4;
}

message CloseRequest {
    // connectID of the stream to close
    int64 connectID = 1;
}

// ACK message usable for both directions
message DataAck {
  // connectID to connect to
  int64 connectID = 1;
}

message CloseResponse {
    // error message
    string error = 1;

    // connectID indicates the identifier of the connection
    int64 connectID = 2;
}

message CloseDial {
    // random id of the DialRequest
    int64 random = 1;
}

message Drain {
  // A hint from an Agent to Server that it is pending termination.
  // A Server should prefer non-draining agents for new dials.
}

message Data {
    // connectID to connect to
    int64 connectID = 1;

    // error message if error happens
    string error = 2;

    // stream data
    bytes data = 3;
}
