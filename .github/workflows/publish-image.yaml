---
  # yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
  name: "Container: Image Build"
  on:
    workflow_dispatch:

  jobs:
    publish-images:
      name: Publish Image
      permissions:
        contents: write
        packages: write
      runs-on: ubuntu-22.04

      steps:
        - name: Checkout repository
          uses: actions/checkout@v5
          with:
            fetch-depth: 0

        - name: Log into registry ghcr.io
          uses: docker/login-action@v3.6.0 
          with:
            registry: ghcr.io
            username: ${{ github.actor }}
            password: ${{ secrets.GITHUB_TOKEN }}

        - name: Set up QEMU
          uses: docker/setup-qemu-action@v3.6.0

        - name: Set up Docker Buildx
          uses: docker/setup-buildx-action@v3.11.1

        - name: Set image tag
          run: |
            git remote add upstream https://github.com/kubernetes-sigs/apiserver-network-proxy.git
            git fetch --tags upstream
            echo "VERSION=$(git describe --tags  --abbrev=0  --match 'v*')" >> $GITHUB_ENV

        - name: Build images
          run: |
            # TODO: how to add tag in make file
            make docker-build-all REGISTRY=ghcr.io/${{ github.repository }} TAG=${{ env.VERSION }}-${GITHUB_SHA::7}

        - name: Push images
          run: |
            echo "using tag: ${{ env.VERSION }}"
            make docker-push-all REGISTRY=ghcr.io/${{ github.repository }} TAG=${{ env.VERSION }}-${GITHUB_SHA::7}
